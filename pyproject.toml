[project]
name = "qr-print-inbox"
version = "0.1.0"
description = "Transfer files from a phone directly to a Windows PC using a QR code."
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "pillow>=12,<13",
    "pydantic-settings>=2.6,<3",
    "pypdf>=6,<7",
    "qrcode>=8,<9",
    "tzdata>=2025.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "zxing-cpp>=3,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.per-file-target-version]
"backend/*.py" = "py38"
